name: Terraform Validation

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.tftest.hcl'
      - '**.md'
      - 'tests/**'
      - '.tflint.hcl'
      - '.terraform-docs.yml'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - examples/basic
          - examples/live
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize without a state backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false
      - name: Validate configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Initialize without a state backend
        run: terraform init -backend=false
      - name: Terraform test
        run: terraform test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
      - name: Initialize TFLint
        run: tflint --init
      - name: Run TFLint
        run: tflint -f compact --recursive

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify generated reference is current
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  checks-passed:
    name: Checks passed
    # One stable required status check for branch protection. Dependabot
    # auto-merge waits on it, so it covers every job above without listing each.
    if: always()
    needs: [validate, test, lint, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
